name: Release

# Stages a release on npm when a GitHub Release is published. Authenticates through
# npm trusted publishing (OIDC), so no npm token is stored in this repository.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci

      - name: Release tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run test:package

      - name: Skip if this version is already on npm
        id: npm
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published, nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # The trusted publisher only allows staged publishing: the version is uploaded
      # but stays private until it's approved with `npm stage approve <id>` (2FA).
      - name: Stage the release on npm
        if: steps.npm.outputs.published != 'true'
        run: npm stage publish
